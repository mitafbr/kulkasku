# Setiap kali kamu push ke branch main, GitHub otomatis:
#  1. membangun versi WEB lalu menayangkannya di GitHub Pages
#  2. membangun APK Android lalu menaruhnya di halaman Releases
name: Build Kulkasku (Web + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kulkasku-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan folder platform
        run: |
          flutter create --org id.mitafbr --project-name kulkasku --platforms=web,android .
          dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Tayangkan ke GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan folder platform
        run: |
          flutter create --org id.mitafbr --project-name kulkasku --platforms=web,android .
          dart run tool/setup.dart
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kulkasku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kulkasku v1.0.${{ github.run_number }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            APK Kulkasku terbaru. Unduh `app-release.apk`, buka di HP Android, izinkan "Instal dari sumber tidak dikenal".
            Dibuat oleh Mita · MIT License © 2026 Mita.
